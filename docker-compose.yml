version: '3'

services:
  web:
    build: .
    container_name: cloudthink_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=root
      - MYSQL_PASS=123456
      - MYSQL_DB=cloudthink

  db:
    image: mysql:5.7
    container_name: cloudthink_db
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: cloudthink
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./cloudthink.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sample_data.sql:/docker-entrypoint-initdb.d/02-data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
